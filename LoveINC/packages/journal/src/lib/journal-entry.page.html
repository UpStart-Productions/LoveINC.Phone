<ion-header [translucent]="false" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref()" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ routeIsNew ? 'New entry' : 'Edit entry' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        *ngIf="!routeIsNew"
        (click)="confirmDelete()"
        fill="clear"
        color="danger"
        aria-label="Delete entry"
      >
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
      <ion-button
        (click)="done()"
        [disabled]="saving"
        aria-label="Done editing entry"
      >
        {{ saving ? 'Saving…' : 'Done' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="journal-entry-content">
  <div *ngIf="loading" class="ion-padding">
    <p>Loading…</p>
  </div>
  <ng-container *ngIf="!loading">
    <div class="ion-padding title-field">
      <ion-input
        fill="clear"
        [(ngModel)]="title"
        (ngModelChange)="scheduleAutoSave()"
        name="title"
        placeholder="Title"
        autocapitalize="words"
        inputmode="text"
      ></ion-input>
    </div>
    <div class="quill-block">
      <app-journal-quill-editor
        [(ngModel)]="content"
        (contentChanged)="scheduleAutoSave()"
        [config]="quillConfig"
        name="content"
      ></app-journal-quill-editor>
    </div>
  </ng-container>
</ion-content>
