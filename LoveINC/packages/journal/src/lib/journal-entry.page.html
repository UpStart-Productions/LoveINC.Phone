<ion-header [translucent]="false" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref()"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ routeIsNew ? 'New entry' : 'Edit entry' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        *ngIf="entryId !== null"
        (click)="confirmDelete()"
        fill="clear"
        color="danger"
        aria-label="Delete entry"
      >
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
      <ion-button
        (click)="shareEntry()"
        [disabled]="!canShareEntry"
        fill="clear"
        aria-label="Share entry"
      >
        <ion-icon slot="icon-only" name="share-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="journal-entry-content">
  <div *ngIf="loading" class="ion-padding">
    <p>Loading…</p>
  </div>
  <ng-container *ngIf="!loading">
    <div class="journal-entry-body">
      <div class="ion-padding title-field">
        <ion-input
          fill="clear"
          [(ngModel)]="title"
          (ngModelChange)="scheduleAutoSave()"
          name="title"
          placeholder="Title"
          autocapitalize="words"
          inputmode="text"
        ></ion-input>
      </div>
      <div class="quill-block">
        <app-journal-quill-editor
          [(ngModel)]="content"
          (contentChanged)="scheduleAutoSave()"
          [config]="quillConfig"
          name="content"
        ></app-journal-quill-editor>
      </div>
    </div>
  </ng-container>
</ion-content>
