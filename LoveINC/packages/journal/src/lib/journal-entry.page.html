<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref()" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isNew ? 'New entry' : 'Edit entry' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        *ngIf="!isNew"
        (click)="confirmDelete()"
        fill="clear"
        color="danger"
        aria-label="Delete entry"
      >
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
      <ion-button
        (click)="save()"
        [disabled]="saving"
        strong="true"
        aria-label="Save entry"
      >
        {{ saving ? 'Saving…' : 'Save' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="loading" class="ion-padding">
    <p class="app-body-secondary">Loading…</p>
  </div>
  <ng-container *ngIf="!loading">
    <ion-list [inset]="true" lines="none">
      <ion-item>
        <ion-input
          label="Title"
          labelPlacement="stacked"
          [(ngModel)]="title"
          name="title"
          placeholder="Entry title"
        ></ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding quill-block">
      <app-journal-quill-editor
        [(ngModel)]="content"
        [config]="quillConfig"
        name="content"
      ></app-journal-quill-editor>
    </div>
  </ng-container>
</ion-content>
