<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        [defaultHref]="defaultBackHref"
        (click.capture)="onBackClick($event)"
      ></ion-back-button>
    </ion-buttons>
    <ion-title>Journal</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addEntry()" fill="clear" aria-label="Add entry">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="journal-list-page">
  <div *ngIf="loading" class="p-l-18 p-r-18 p-t-18">
    <p class="app-body-secondary">Loading…</p>
  </div>
  <ng-container *ngIf="!loading && entries.length === 0">
    <div class="journal-list-header-photo">
      <img
        src="assets/photos/journal-header.png"
        alt="Open notebook and pen on a desk, ready for journaling"
      />
    </div>
    <div class="empty-state p-l-18 p-r-18 p-t-18 p-b-18">
      <p class="app-body-secondary m-b-12">
        Your journal is a private space on this device for reflections, prayers, or notes—with rich text when you want it.
      </p>
      <p class="app-body-secondary m-b-24">
        Start whenever you are ready; only you see what you write here.
      </p>
      <ion-button expand="block" color="primary" (click)="addEntry()">
        Add your first entry
      </ion-button>
    </div>
  </ng-container>
  <ion-card *ngIf="!loading && entries.length > 0" class="journal-list-card">
    <ion-list lines="none">
      <ion-item
        *ngFor="let e of entries"
        [routerLink]="['/tabs/journal', e.id]"
        queryParamsHandling="preserve"
        [detail]="false"
        [button]="true"
      >
        <ion-label class="ion-text-wrap">
          <p class="app-list-row-title">{{ e.title || 'Untitled' }}</p>
        </ion-label>
        <ion-badge
          *ngIf="e.updatedAt"
          class="journal-entry-updated-badge"
          slot="end"
          color="success"
        >
          {{ formatUpdatedMonthDay(e.updatedAt) }}
        </ion-badge>
        <ion-icon
          class="list-row-chevron"
          name="chevron-forward-outline"
          slot="end"
          aria-hidden="true"
        ></ion-icon>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>
