<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tools"></ion-back-button>
    </ion-buttons>
    <ion-title>Journal</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addEntry()" fill="clear" aria-label="Add entry">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="loading" class="ion-padding">
    <p class="app-body-secondary">Loading…</p>
  </div>
  <div
    *ngIf="!loading && entries.length === 0"
    class="ion-padding empty-state"
  >
    <p class="app-body-secondary">No journal entries yet.</p>
    <p class="app-caption">Tap + to add your first entry.</p>
  </div>
  <ion-card *ngIf="!loading && entries.length > 0" class="journal-list-card">
    <ion-list lines="none">
      <ion-item
        *ngFor="let e of entries"
        [routerLink]="['/tabs/journal', e.id]"
        [detail]="false"
        [button]="true"
      >
        <ion-label class="ion-text-wrap">
          <p class="app-body-sm">{{ e.title || 'Untitled' }}</p>
        </ion-label>
        <ion-badge
          *ngIf="e.updatedAt"
          class="journal-entry-updated-badge"
          slot="end"
          color="success"
        >
          {{ formatUpdatedMonthDay(e.updatedAt) }}
        </ion-badge>
        <ion-icon
          class="list-row-chevron"
          name="chevron-forward-outline"
          slot="end"
          aria-hidden="true"
        ></ion-icon>
      </ion-item>
    </ion-list>
  </ion-card>
</ion-content>
