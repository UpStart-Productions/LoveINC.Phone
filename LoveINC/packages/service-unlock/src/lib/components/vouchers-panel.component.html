<ion-card class="section-card">
  <ion-card-header>
    <ion-card-title>
      <ion-icon
        [name]="hasAnyValidVoucher ? 'ticket-outline' : 'time-outline'"
        [color]="hasAnyValidVoucher ? 'success' : 'medium'"
        class="section-icon"></ion-icon>
      My Vouchers
    </ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <div class="voucher-cards">
      <div
        *ngFor="let v of vouchers"
        class="voucher-card"
        [class.voucher-card--expired]="isVoucherExpiredOrUsed(v)"
        (click)="onVoucherCardClick(v)">
        <div class="voucher-card-photo">
          <img *ngIf="v.photoUrl && !hasPhotoLoadFailed(v.id)" [src]="v.photoUrl" [alt]="v.serviceLabel" (error)="markPhotoFailed(v.id)" />
          <ion-icon *ngIf="!v.photoUrl || hasPhotoLoadFailed(v.id)" name="ticket-outline" class="voucher-card-placeholder"></ion-icon>
        </div>
        <div class="voucher-card-center">
          <h3 class="voucher-card-title app-title">{{ v.serviceLabel }}</h3>
          <p *ngIf="v.shortDescription" class="voucher-card-desc app-body-secondary-sm">{{ v.shortDescription }}</p>
        </div>
        @if (isVoucherExpiredOrUsed(v) || v.expiresAt) {
          <div class="voucher-card-exp">
            @if (isVoucherExpiredOrUsed(v)) {
              <ion-icon name="trash-outline" class="voucher-card-delete" (click)="onRemoveVoucher($event, v)"></ion-icon>
            } @else {
              <span class="exp-label app-body-secondary-sm app-uppercase">EXP</span>
              <span class="exp-day app-title">{{ formatExpDay(v.expiresAt!) }}</span>
              <span class="exp-month app-body-secondary-sm app-uppercase">{{ formatExpMonth(v.expiresAt!) }}</span>
            }
          </div>
        }
      </div>
    </div>
  </ion-card-content>
</ion-card>
