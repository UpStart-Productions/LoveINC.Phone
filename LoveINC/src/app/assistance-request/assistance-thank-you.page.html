<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Thank You</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <h2 class="m-b-18">Thank You</h2>
  <p class="app-body-secondary m-b-24">
    Your assistance request has been received. Our team will be in touch within 1–2 business days.
  </p>
  <ion-button expand="block" color="primary" (click)="onDone()">
    Done
  </ion-button>
</ion-content>
