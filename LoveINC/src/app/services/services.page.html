<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button></app-back-button>
    </ion-buttons>
    <ion-title>
      Services
    </ion-title>
    <ion-buttons slot="end">
      <app-notifications-button></app-notifications-button>
      <ion-button *ngIf="showDonateButton" (click)="openDonateMenu()" class="donate-header-button">
        <ion-icon slot="icon-only" name="gift-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item 
      button 
      detail="false"
      *ngFor="let service of services"
      (click)="handleServiceClick(service)">
      <i-lucide *ngIf="service.lucideIcon" [name]="service.lucideIcon" [size]="24" color="var(--ion-color-primary)" slot="start"></i-lucide>
      <ion-icon *ngIf="!service.lucideIcon" [name]="service.icon" slot="start"></ion-icon>
      <ion-label>{{ service.name }}</ion-label>
      <ion-icon
        class="list-row-chevron"
        name="chevron-forward-outline"
        slot="end"
        aria-hidden="true"
      ></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
