<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/more"></ion-back-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Name and Email (if present) with Edit -->
  <ion-card class="section-card">
    <ion-card-content>
      @if (displayName || userProfile.email) {
        @if (displayName) {
          <p class="m-b-6">{{ displayName }}</p>
        }
        @if (userProfile.email) {
          <p class="app-body-secondary m-b-12">{{ userProfile.email }}</p>
        }
      }
      <ion-button fill="clear" size="small" (click)="editProfile()">
        {{ (displayName || userProfile.email) ? 'Edit' : 'Add your information' }}
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Service Access -->
  <app-service-access-section
    class="m-18"
    [scanClickHandler]="onScanRequested">
  </app-service-access-section>

  <!-- Settings -->
  <ion-card class="section-card">
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="settings-outline" class="section-icon"></ion-icon>
        Settings
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
    </ion-card-content>
  </ion-card>

  <!-- Developer/Testing Section -->
  <div class="developer-section p-l-24 p-r-24 p-b-24">
    <p class="developer-label m-b-6">Developer Options</p>
    <button class="reset-link p-6 p-l-18 p-r-18" (click)="navigateToDeveloperOptions()">
      Developer Options
    </button>
    <button class="reset-link p-6 p-l-18 p-r-18" (click)="navigateToSandbox()">
      Sandbox - POC Ideas
    </button>
  </div>

  <!-- Bottom Spacing -->
  <div style="height: 100px;"></div>
</ion-content>
