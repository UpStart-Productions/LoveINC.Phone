<ion-tabs (ionTabsDidChange)="onTabsDidChange()">
  @if (showMainTabBar()) {
    <div class="floating-tab-bar-shell" slot="bottom">
      <div class="custom-tab-bar" #tabBarTrack>
        <span
          class="tab-bar-highlight"
          [class.tab-bar-highlight-animate]="highlightAnimate()"
          [style.transform]="highlightTransform()"
          [style.opacity]="highlightVisible() ? 1 : 0"
          aria-hidden="true"
        ></span>

        <ion-tab-bar class="custom-tab-bar-inner" (ionTabBarChanged)="onTabBarChanged($event)">
          <ion-tab-button tab="home" href="/tabs/home" aria-label="Home">
            <span class="tab-bar-tab-content">
              <i-lucide name="house-heart" [size]="26" class="tab-bar-lucide-icon"></i-lucide>
            </span>
          </ion-tab-button>

          <ion-tab-button tab="updates" href="/tabs/updates" aria-label="Updates">
            <span class="tab-bar-tab-content">
              <i-lucide name="newspaper" [size]="26" class="tab-bar-lucide-icon"></i-lucide>
            </span>
          </ion-tab-button>

          <ion-tab-button tab="impact-stories" href="/tabs/impact-stories" aria-label="Stories">
            <span class="tab-bar-tab-content">
              <i-lucide name="book-marked" [size]="26" class="tab-bar-lucide-icon"></i-lucide>
            </span>
          </ion-tab-button>

          <ion-tab-button tab="tools" href="/tabs/tools" aria-label="Learn">
            <span class="tab-bar-tab-content">
              <i-lucide name="graduation-cap" [size]="26" class="tab-bar-lucide-icon"></i-lucide>
            </span>
          </ion-tab-button>

          <ion-tab-button tab="more" href="/tabs/more" aria-label="More">
            <span class="tab-bar-tab-content">
              <i-lucide name="menu" [size]="26" class="tab-bar-lucide-icon"></i-lucide>
            </span>
          </ion-tab-button>

          <button
            type="button"
            class="tab-bar-services-fab"
            aria-label="Services"
            (click)="toggleServicesMenu()"
          >
            <span class="love-inc-heart-logo tab-bar-services-fab-logo" aria-hidden="true"></span>
          </button>
        </ion-tab-bar>
      </div>
    </div>
  }
</ion-tabs>
