<ion-header [translucent]="false">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <app-back-button [onLightBackground]="true"></app-back-button>
    </ion-buttons>
    <ion-title>Summary</ion-title>
    <ion-buttons slot="end">
      <ion-button
        fill="clear"
        aria-label="Share summary"
        [disabled]="loading || sharing"
        (click)="shareStats()"
      >
        <ion-icon slot="icon-only" name="share-outline"></ion-icon>
      </ion-button>
      <ion-button
        fill="clear"
        aria-label="Export summary PDF"
        [disabled]="loading || exporting"
        (click)="exportPdf()"
      >
        <ion-icon slot="icon-only" name="document-text-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="statistics-fixed">
    <div class="total-done">
      <h2>{{ mealsCookedLabel }}</h2>
      <span class="total-percent">{{ totalPercent }}%</span>
    </div>

    <div class="statistics-chart">
      <app-weekly-bar-chart [data]="weeklyData" unitNoun="meals"></app-weekly-bar-chart>
    </div>

    <div class="week-nav" [class.year-view]="chartView === 'year'">
      @if (chartView === 'week') {
        <ion-button fill="clear" size="small" aria-label="Previous weeks" (click)="prevWeek()">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </ion-button>
      }
      <span
        class="week-selector"
        role="button"
        tabindex="0"
        [attr.aria-label]="chartView === 'week' ? 'Switch to year view' : 'Switch to week view'"
        (click)="toggleChartView()"
        (keydown.enter)="toggleChartView()"
        (keydown.space)="$event.preventDefault(); toggleChartView()"
      >{{ periodLabel }}</span>
      @if (chartView === 'week') {
        <ion-button fill="clear" size="small" aria-label="Next weeks" (click)="nextWeek()">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </ion-button>
      }
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="app-card-page meal-summary-content">
  @if (loading) {
    <div class="page-shell"></div>
  } @else if (!cookedListItems.length) {
    <p class="meal-summary-empty app-body-secondary">No meals cooked for this period yet.</p>
  } @else {
    @if (recapNarrative) {
      <p class="meal-summary-narrative">{{ recapNarrative }}</p>
    }
    <app-content-card-list
      [items]="cookedListItems"
      [flushTop]="true"
      [compactCategoryLabel]="true"
    />
  }
</ion-content>
