<ion-header>
  <ion-toolbar class="meal-recap-sheet-toolbar">
    <ion-title>How was it?</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" class="close-button" aria-label="Close" (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="meal-recap-sheet-content">
  <div class="meal-recap-reactions" role="group" aria-label="How was the meal?">
    @for (reaction of reactions; track reaction.id) {
      <button
        type="button"
        class="meal-recap-reaction"
        [class.meal-recap-reaction--selected]="isReactionSelected(reaction.emoji)"
        [attr.aria-pressed]="isReactionSelected(reaction.emoji)"
        (click)="selectReaction(reaction.emoji)"
      >
        <span class="meal-recap-reaction__emoji" aria-hidden="true">{{ reaction.emoji }}</span>
        <span class="meal-recap-reaction__label">{{ reaction.label }}</span>
      </button>
    }
  </div>

  <div class="meal-recap-ratings" role="group" aria-label="Meal ratings">
    @for (dimension of ratingDimensions; track dimension.key) {
      <div class="meal-recap-rating">
        <div class="meal-recap-rating__buttons">
          <button
            type="button"
            class="meal-recap-thumb"
            [class.meal-recap-thumb--selected]="isRatingSelected(dimension.key, 'down')"
            [attr.aria-pressed]="isRatingSelected(dimension.key, 'down')"
            [attr.aria-label]="dimension.label + ' thumbs down'"
            (click)="selectRating(dimension.key, 'down')"
          >
            <span aria-hidden="true">{{ thumbDownEmoji }}</span>
          </button>
          <button
            type="button"
            class="meal-recap-thumb"
            [class.meal-recap-thumb--selected]="isRatingSelected(dimension.key, 'up')"
            [attr.aria-pressed]="isRatingSelected(dimension.key, 'up')"
            [attr.aria-label]="dimension.label + ' thumbs up'"
            (click)="selectRating(dimension.key, 'up')"
          >
            <span aria-hidden="true">{{ thumbUpEmoji }}</span>
          </button>
        </div>
        <span class="meal-recap-rating__label">{{ dimension.label }}</span>
      </div>
    }
  </div>

  <ion-item class="meal-recap-notes-field">
    <ion-label position="stacked">Anything to remember for next time?</ion-label>
    <ion-textarea
      [(ngModel)]="notes"
      (ngModelChange)="onNotesChange()"
      rows="3"
      [autoGrow]="true"
      autocapitalize="sentences"
    ></ion-textarea>
  </ion-item>
</ion-content>
