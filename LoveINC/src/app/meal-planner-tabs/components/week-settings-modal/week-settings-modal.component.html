<ion-header>
  <ion-toolbar>
    <ion-title>Household &amp; week</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" aria-label="Close" (click)="dismiss()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="stacked">Household size</ion-label>
      <ion-input type="number" min="1" [(ngModel)]="householdSize"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Max cook time (minutes)</ion-label>
      <ion-input type="number" min="15" [(ngModel)]="maxReadyMinutes"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Extra servings from each meal</ion-label>
      <ion-input type="number" min="0" [(ngModel)]="weekServingDelta"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Note for this week (guests or events)</ion-label>
      <ion-textarea autoGrow="true" rows="4" [(ngModel)]="weekNote"></ion-textarea>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="red-orange" (click)="save()">Save</ion-button>
</ion-content>
