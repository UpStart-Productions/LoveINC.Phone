<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Impact Stories</ion-title>
    <ion-buttons slot="end"><app-header-actions /></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="app-card-page impact-stories-page">
  <div class="cards-container">
    <app-card
      *ngFor="let story of stories"
      class="app-card-compact app-card-impact"
      [imageUrl]="getPhotoUrl(story)"
      [title]="story.title"
      [description]="story.shortDescription ?? story.longDescription ?? ''"
      [badgeActions]="true"
      [clickable]="true"
      (cardClick)="navigateToDetail(story)"
      (shareClick)="onShareStory(story)">
    </app-card>
  </div>
</ion-content>
