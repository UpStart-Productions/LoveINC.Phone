<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button></app-back-button>
    </ion-buttons>
    <ion-title>Volunteer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (!positions.length) {
    <div class="empty-state">
      <p class="app-body-secondary-sm m-b-24">No volunteer positions are currently available.</p>
      <ion-button
        expand="block"
        color="primary"
        class="pill-button"
        (click)="openVolunteerSignup()">
        Become a Volunteer
      </ion-button>
    </div>
  } @else {
    @if (!hasOpenPositions) {
      <div class="empty-state empty-state--inline">
        <p class="app-body-secondary-sm m-b-24">No open volunteer positions right now.</p>
        <ion-button
          expand="block"
          color="primary"
          class="pill-button"
          (click)="openVolunteerSignup()">
          Become a Volunteer
        </ion-button>
      </div>
    }

    <div class="positions-list">
      @for (position of positions; track position.id) {
        <app-content-card
          [title]="position.title ?? 'Volunteer'"
          [detail]="getCardDetail(position)"
          [imageUrl]="getPhotoUrl(position) || undefined"
          [iconName]="getPhotoUrl(position) ? undefined : 'heart-outline'"
          [iconBackgroundColor]="'#349394'"
          [asideBadge]="isPositionOpen(position) ? 'Open' : undefined"
          asideBadgeColor="success"
          [route]="'/tabs/content-detail/volunteer-position/' + position.id + '?from=volunteer-positions'"
        />
      }
    </div>
  }
</ion-content>
