<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button></app-back-button>
    </ion-buttons>
    <ion-title>Volunteer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (positions.length === 0) {
    <div class="empty-state">
      <p class="app-body-secondary-sm">No volunteer positions are currently available.</p>
    </div>
  } @else {
    <div class="positions-list">
      @for (position of positions; track position.id) {
        <app-content-card
          [category]="position.affiliate?.name"
          [categoryIcon]="position.affiliate ? 'business-outline' : undefined"
          [title]="position.title ?? 'Volunteer'"
          [detail]="getCardDetail(position)"
          [imageUrl]="getPhotoUrl(position) || undefined"
          [iconName]="getPhotoUrl(position) ? undefined : 'heart-outline'"
          [iconBackgroundColor]="'#349394'"
          [route]="'/tabs/content-detail/volunteer-position/' + position.id + '?from=volunteer-positions'"
        />
      }
    </div>
  }
</ion-content>
