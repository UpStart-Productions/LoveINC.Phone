@if (plan.coverPhotoUrl) {
  <div class="content-reader-hero">
    <img [src]="plan.coverPhotoUrl" [alt]="plan.title" class="content-reader-hero__image" />
    <div class="content-reader-hero__gradient" aria-hidden="true"></div>
    <div class="content-reader-hero__text">
      <p class="content-reader-hero__title app-title">{{ plan.title }}</p>
      @if (hasPlanAuthor) {
        <div class="content-reader-hero__author">
          @if (plan.author.avatarUrl) {
            <img
              class="content-reader-hero__author-avatar"
              [src]="plan.author.avatarUrl"
              [alt]="plan.author.name"
            />
          } @else {
            <span
              class="content-reader-hero__author-avatar content-reader-hero__author-avatar--placeholder"
              aria-hidden="true"
            >
              <ion-icon name="person-outline"></ion-icon>
            </span>
          }
          <span class="content-reader-hero__author-label">By {{ plan.author.name }}</span>
        </div>
      }
    </div>
  </div>
} @else {
  <div class="content-reader-body p-l-18 p-r-18">
    <div class="app-font-crimson m-t-18 m-b-18">
      <p class="app-title">{{ plan.title }}</p>
    </div>
  </div>
}

<app-content-card-list
  [items]="listItems"
  [compactCategoryLabel]="true"
  [defaultNavigationFrom]="navigationFrom"
/>
