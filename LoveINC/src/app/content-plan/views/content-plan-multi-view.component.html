@if (pageIndex === 0 && plan.coverPhotoUrl) {
  <div class="content-reader-hero">
    <img [src]="plan.coverPhotoUrl" [alt]="plan.title" class="content-reader-hero__image" />
    <div class="content-reader-hero__gradient" aria-hidden="true"></div>
    <div class="content-reader-hero__text">
      <p class="content-reader-hero__title app-title">{{ plan.title }}</p>
      <app-content-plan-author-hero [author]="plan.author" />
    </div>
  </div>
}

<div class="content-reader-body p-l-18 p-r-18 p-b-36">
  @if (pageIndex === 0 && !plan.coverPhotoUrl) {
    <div class="app-font-crimson m-t-18 m-b-18">
      <p class="app-title">{{ plan.title }}</p>
    </div>
  }

  @if (activeMoment) {
    <div class="app-font-crimson">
      @if (activeMoment.title.trim()) {
        <div class="content-reader-step-header m-t-18 m-b-6">
          <p class="app-title app-uppercase">{{ activeMoment.title }}</p>
        </div>
      }
      <ion-card class="content-reader-panel-card">
        <div class="ion-padding app-body">
          <app-moment-blocks
            [blocks]="activeMoment.blocks"
            [planId]="plan.id"
            [planTitle]="plan.title"
            [themeName]="plan.theme.name"
            [planMomentId]="activeMoment.planMomentId"
          />
        </div>
      </ion-card>
    </div>
  }
</div>
