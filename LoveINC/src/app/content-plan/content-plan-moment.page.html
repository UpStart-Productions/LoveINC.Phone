<ion-header class="content-reader-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button [fallback]="planFallback"></app-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="content-reader-scroll">
  @if (loading) {
    <div class="content-reader-loading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (!moment) {
    <div class="content-reader-empty p-l-18 p-r-18 p-t-18">
      <p class="app-body-secondary-sm">This moment could not be found.</p>
    </div>
  } @else {
    <div class="content-reader-body p-l-18 p-r-18 p-b-36">
      <section class="content-reader-section">
        <div class="app-font-crimson">
          <div class="content-reader-step-header m-t-18 m-b-18">
            <p class="app-title app-uppercase">{{ moment.title }}</p>
          </div>
        </div>

        <div class="app-font-crimson">
          <ion-card class="content-reader-panel-card">
            <div class="ion-padding app-body">
              <app-moment-blocks [blocks]="moment.blocks" />
            </div>
          </ion-card>
        </div>
      </section>
    </div>
  }
</ion-content>
