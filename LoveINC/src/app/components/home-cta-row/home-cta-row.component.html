<ion-item
  class="home-cta-row-item"
  [class.home-cta-row-item--flat]="row.id === 'get-help' || row.id === 'give-now' || row.id === 'volunteer' || row.id === 'connection-center'"
  button
  detail="false"
  lines="none"
  (click)="onRowClick()">
  @if (row.photoUrl) {
    <img slot="start" [src]="row.photoUrl" alt="" class="home-cta-row__photo" />
  }
  <ion-label>
    <p class="app-title">{{ row.body }}</p>
    @if (row.subtitle) {
      <p class="app-body-secondary-xs m-t-4">{{ row.subtitle }}</p>
    }
    @if (showProgress && progressAmountsText) {
      <p class="app-body-secondary-xs m-t-4">
        <span
          class="home-cta-row__progress-figures"
          [class.home-cta-row__progress-figures--low]="progressFigureLevel === 'low'"
          [class.home-cta-row__progress-figures--mid]="progressFigureLevel === 'mid'"
          [class.home-cta-row__progress-figures--high]="progressFigureLevel === 'high'"
        >{{ progressAmountsText }}</span>{{ progressUnitSuffix }}
      </p>
      <ion-progress-bar
        [value]="progressValue"
        class="home-cta-row__progress-bar m-t-6"
        [style.--progress-background]="progressBarFillColor">
      </ion-progress-bar>
    }
  </ion-label>
  <div
    slot="end"
    class="action-pill home-cta-row__pill"
    [class.home-cta-row__pill--with-icon]="row.iconName && !row.photoUrl"
    [style.background-color]="row.pillColor">
    @if (row.iconName && !row.photoUrl) {
      <span class="home-cta-row__pill-icon-wrap">
        <ion-icon
          [name]="row.iconName"
          class="home-cta-row__pill-icon"
          [style.color]="row.iconColor">
        </ion-icon>
      </span>
    }
    <span class="home-cta-row__pill-text">{{ row.pillText }}</span>
  </div>
</ion-item>
