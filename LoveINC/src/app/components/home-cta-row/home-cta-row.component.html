<ion-item
  class="cta-row-item m-b-6"
  button
  detail="false"
  lines="none"
  (click)="onCardClick()">
  @if (cta.photoUrl) {
    <img slot="start" [src]="cta.photoUrl" alt="" class="cta-row-photo m-r-18" />
  } @else {
    <ion-icon [name]="iconName" slot="start" class="cta-row-icon m-r-18" [style.color]="accentColor"></ion-icon>
  }
  <ion-label>
    <p class="app-title">{{ cta.title }}</p>
    @if (contextSubtitle) {
      <p class="app-body-secondary-xs m-t-4">{{ contextSubtitle }}</p>
    }
    @if (showProgressBar && progressAmountsText) {
      <p class="app-body-secondary-xs m-t-4">
        <span
          class="cta-progress-figures"
          [class.cta-progress-figures--low]="progressFigureLevel === 'low'"
          [class.cta-progress-figures--mid]="progressFigureLevel === 'mid'"
          [class.cta-progress-figures--high]="progressFigureLevel === 'high'"
        >{{ progressAmountsText }}</span>{{ progressUnitSuffix }}
      </p>
      <ion-progress-bar
        [value]="progressValue"
        class="cta-progress-bar m-t-6"
        [style.--progress-background]="progressBarFillColor">
      </ion-progress-bar>
    }
  </ion-label>
  <div slot="end" class="action-pill m-l-12" [style.background-color]="accentColor">
    {{ pillText }}
  </div>
</ion-item>
