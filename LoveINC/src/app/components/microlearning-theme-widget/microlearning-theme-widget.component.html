@if (loaded && theme) {
  <app-peek-carousel
    [variant]="carouselVariant"
    [sectionTitle]="displayHeading"
    [sectionTitleIconSvg]="displaySectionTitleIconSvg"
    [sectionTitleInset]="sectionTitleInset"
    [themeId]="theme.id"
    [themeName]="theme.name"
    [clickable]="clickable"
    (slideClick)="slideClick.emit($event)"
  />
}
