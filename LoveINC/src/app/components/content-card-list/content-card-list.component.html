<div
  class="content-card-list"
  [class.content-card-list--flush-top]="flushTop"
  [class.content-card-list--light-shell]="lightShell"
>
  <div class="content-card-list-shell" [class.content-card-list-shell--light]="lightShell">
    @for (item of items; track trackItem($index, item); let last = $last) {
      <app-content-card
        [listRow]="true"
        [listDivider]="!last"
      [compactCategoryLabel]="item.compactCategoryLabel ?? compactCategoryLabel"
      [uppercaseLabel]="item.uppercaseLabel"
      [category]="item.category"
      [categoryIcon]="item.categoryIcon"
      [lucideCategoryIcon]="item.lucideCategoryIcon"
      [categoryIconSvg]="item.categoryIconSvg"
      [categoryExtra]="item.categoryExtra"
      [title]="item.title"
      [titleSegments]="item.titleSegments"
      [lucideTitleIcon]="item.lucideTitleIcon"
      [saveToggle]="item.saveToggle ?? false"
      [saved]="item.saved ?? false"
      [tags]="item.tags"
      [underTitle]="item.underTitle"
      [detail]="item.detail"
      [mealStarRating]="item.mealStarRating"
      [detailSegments]="item.detailSegments"
      [imageUrl]="item.imageUrl"
      [imageOnMutedBackground]="item.imageOnMutedBackground ?? false"
      [iconName]="item.iconName"
      [lucideIcon]="item.lucideIcon"
      [iconBackgroundColor]="item.iconBackgroundColor ?? defaultIconBackgroundColor"
      [route]="item.route"
      [navigationFrom]="item.navigationFrom ?? defaultNavigationFrom"
      [preserveQueryParams]="item.preserveQueryParams ?? false"
      [tapUnderTitleToOpenMap]="item.tapUnderTitleToOpenMap ?? false"
      [mapPhone]="item.mapPhone"
      [mapWebsite]="item.mapWebsite"
      [asideBadge]="item.asideBadge"
      [asideBadgeColor]="item.asideBadgeColor ?? 'success'"
      [avatarOverlayIcon]="item.avatarOverlayIcon"
      [avatarOverlayIconColor]="item.avatarOverlayIconColor ?? 'success'"
      [authorName]="item.authorName"
      [authorAvatarUrl]="item.authorAvatarUrl"
      [authorTitle]="item.authorTitle"
      [authorBio]="item.authorBio"
      [createdAtLabel]="item.createdAtLabel"
      [createdAtLabelDanger]="item.createdAtLabelDanger ?? false"
      [createdAtInlineWithAuthor]="item.createdAtInlineWithAuthor ?? false"
      [asideAvatarSize]="item.asideAvatarSize ?? defaultAsideAvatarSize"
      [clickable]="item.route ? true : item.clickable !== false"
      (cardClick)="onCardClick(item)"
      (saveClick)="saveClick.emit(item)"
      />
    }
  </div>
</div>
