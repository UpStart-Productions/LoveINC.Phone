<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" aria-hidden="true">
      <ion-button
        fill="clear"
        disabled
        class="map-modal-toolbar-balance"
        [attr.tabindex]="-1">
        <ion-icon name="close" slot="icon-only" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ organization }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear" aria-label="Close map">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div id="donation-map" class="map-container"></div>
  <div *ngIf="mapLoadError" class="map-message">
    <p>Map could not load. Check your connection and try again.</p>
  </div>
  <div *ngIf="geocodeError" class="map-message">
    <p>Could not find location on map.</p>
    <p class="app-body-secondary">{{ address }}</p>
  </div>
  <div *ngIf="loading" class="map-message">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading map…</p>
  </div>
</ion-content>
