@if (showCard) {
  <div class="m-b-6">
    <app-content-card
      [compactCategoryLabel]="true"
      [compactDetail]="true"
      [category]="'Tools for Transformation'"
      [categoryIcon]="'compass-outline'"
      [title]="cardTitle"
      [detail]="cardDetail"
      [imageUrl]="photoUrl"
      [iconName]="photoUrl ? undefined : 'compass-outline'"
      [iconBackgroundColor]="'#349394'"
      [avatarOverlayIcon]="photoUrl && isComplete ? 'checkmark-circle' : undefined"
      [avatarOverlayIconColor]="'success'"
      [route]="toolRoute"
      [navigationFrom]="'home'"
    />
  </div>
}
