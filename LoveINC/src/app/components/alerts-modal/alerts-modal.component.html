<ion-header>
  <ion-toolbar>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" fill="clear">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="loading" class="loading p-48 p-l-24 p-r-24">
    <ion-spinner name="crescent" class="m-b-18"></ion-spinner>
    <p>Loading notifications...</p>
  </div>

  <div *ngIf="!loading && notifications.length === 0" class="no-alerts p-48 p-l-24 p-r-24">
    <ion-icon name="notifications-outline" class="m-b-18"></ion-icon>
    <h2 class="m-b-6">No Notifications</h2>
    <p>You're all caught up. Check back later for updates from Love INC Newberg.</p>
  </div>

  <div *ngIf="!loading && notifications.length > 0" class="notifications-wrapper">
    <div class="notifications-scrollable p-18">
      <ion-list lines="none" class="notifications-list">
        <ion-item *ngFor="let notification of notifications" [class.unread]="!notification.read" [class.read]="notification.read" button detail="false" class="notification-item m-b-12" (click)="onNotificationTap(notification)">
          <ion-label>
            <div class="notification-header m-b-6">
              <h2>{{ notification.title }}</h2>
              <div *ngIf="!notification.read" class="unread-dot m-t-6"></div>
            </div>
            <div class="notification-content">
              <p style="line-height: var(--app-line-height-body);" class="m-b-6">{{ notification.body }}</p>
              <div class="notification-footer">
                <span *ngIf="!notification.read" class="new-badge">NEW</span>
                <span class="app-caption">{{ formatDate(notification.createdAt) }}</span>
              </div>
            </div>
          </ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
