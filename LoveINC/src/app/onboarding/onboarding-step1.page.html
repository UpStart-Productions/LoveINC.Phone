<ion-content [fullscreen]="true" class="onboarding-content">
  <!-- Fixed Header Container -->
  <div class="header-container">
    <div class="photo-background-header">
      <div class="photo-overlay"></div>
    </div>
    <div class="logo-container p-l-18 p-r-18">
      <img src="assets/branding/logo-oregon-newberg.webp" alt="Love INC Logo" class="logo-image m-b-24">
      <h1 class="tagline app-display-lg p-l-18 p-r-18">Helping Churches Help People</h1>
    </div>
  </div>

  <!-- Content Container -->
  <div class="content-container p-t-12 p-l-24 p-r-24">
    <div class="content-section m-b-12">
      <p class="mission-text app-title p-l-18 p-r-18">
        We mobilize local churches to transform lives and communities In the Name of Christ. We envision churches united in purpose and actively serving people in need.
      </p>
      <img src="assets/branding/with-love-inc.webp" alt="With Love INC" class="with-love-inc-image">
    </div>

    <!-- Next Button -->
    <ion-button 
      expand="block" 
      size="large"
      fill="clear"
      color="primary"
      class="app-title m-b-24"
      (click)="onNext()">
      Next
      <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
    </ion-button>
  </div>
</ion-content>
