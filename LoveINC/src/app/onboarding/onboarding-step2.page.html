<ion-content [fullscreen]="true" class="onboarding-content">
  <!-- Fixed Header Container -->
  <div class="header-container">
    <div class="photo-background-header">
      <div class="photo-overlay"></div>
    </div>
    <div class="logo-container">
      <img src="assets/branding/logo-oregon-newberg.webp" alt="Love INC Logo" class="logo-image">
      <h1 class="tagline app-display-lg">You are the heart of our ministry.</h1>
    </div>
  </div>

  <!-- Content Container -->
  <div class="content-container">
    <!-- Selection Buttons -->
    <div class="button-group">
      <ion-button 
        expand="block" 
        fill="solid"
        class="option-button app-title get-help-button"
        [class.selected]="isSelected('get-help')"
        (click)="toggleOption('get-help')">
        <div class="checkbox-indicator" *ngIf="isSelected('get-help')">
          <ion-icon name="checkmark"></ion-icon>
        </div>
        <ion-icon slot="start" name="hand-right-outline"></ion-icon>
        Get Help
      </ion-button>

      <ion-button 
        expand="block" 
        fill="solid"
        class="option-button app-title volunteer-button"
        [class.selected]="isSelected('volunteer')"
        (click)="toggleOption('volunteer')">
        <div class="checkbox-indicator" *ngIf="isSelected('volunteer')">
          <ion-icon name="checkmark"></ion-icon>
        </div>
        <ion-icon slot="start" name="heart-outline"></ion-icon>
        Volunteer
      </ion-button>

      <ion-button 
        expand="block" 
        fill="solid"
        class="option-button app-title give-button"
        [class.selected]="isSelected('give')"
        (click)="toggleOption('give')">
        <div class="checkbox-indicator" *ngIf="isSelected('give')">
          <ion-icon name="checkmark"></ion-icon>
        </div>
        <ion-icon slot="start" name="gift-outline"></ion-icon>
        Give
      </ion-button>
    </div>

    <!-- Next Button -->
    <ion-button 
      expand="block" 
      size="large"
      fill="clear"
      color="primary"
      class="app-title m-b-24"
      [disabled]="!canProceed()"
      (click)="onNext()">
      Next
      <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
    </ion-button>
  </div>
</ion-content>
