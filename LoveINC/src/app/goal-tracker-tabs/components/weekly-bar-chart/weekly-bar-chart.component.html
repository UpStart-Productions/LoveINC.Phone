<div class="weekly-bar-chart">
  <div class="chart-bars">
    <div *ngFor="let item of data" class="bar-wrapper">
      <div class="bar-track">
        <div class="bar-fill" [style.height.%]="item.value"></div>
      </div>
      <span class="bar-label">{{ item.label }}</span>
    </div>
  </div>
</div>
