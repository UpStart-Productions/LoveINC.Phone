<ion-header>
  <ion-toolbar>
    <ion-title>{{ pageTitle }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()" fill="clear" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-segment *ngIf="!edit" [(ngModel)]="mode" class="add-mode-segment">
    <ion-segment-button value="goal">
      <ion-label>Goal</ion-label>
    </ion-segment-button>
    <ion-segment-button value="habit">
      <ion-label>Habit</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div *ngIf="mode === 'goal'" class="form-section">
    <ion-item>
      <ion-label position="stacked">Goal name</ion-label>
      <ion-input [(ngModel)]="goalTitle" placeholder="Save for vacation" autocapitalize="sentences"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Description</ion-label>
      <ion-textarea [(ngModel)]="goalDescription" placeholder="Notes about this goal" rows="2" autocapitalize="sentences"></ion-textarea>
    </ion-item>
    <app-color-picker
      label="Color"
      [config]="colorConfig"
      [selectedColor]="goalColor"
      (colorSelectedEvent)="goalColor = $event"
    ></app-color-picker>
    <ion-item>
      <ion-label position="stacked">Target</ion-label>
      <ion-input type="number" [(ngModel)]="goalTarget" placeholder="1000"></ion-input>
    </ion-item>
    <ion-item button (click)="pickGoalDueDate()" class="date-input-row" detail="false">
      <ion-label position="fixed">Due date</ion-label>
      <ion-note slot="end" class="date-value">{{ formatDateDisplay(goalDueDate) || 'Select' }}</ion-note>
    </ion-item>
  </div>

  <div *ngIf="mode === 'habit'" class="form-section">
    <ion-item>
      <ion-label position="stacked">Habit name</ion-label>
      <ion-input [(ngModel)]="habitName" placeholder="Morning run" autocapitalize="sentences"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Description</ion-label>
      <ion-textarea [(ngModel)]="habitDescription" placeholder="Notes" rows="2" autocapitalize="sentences"></ion-textarea>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Goal</ion-label>
      <div class="select-border-wrapper">
        <ion-select [(ngModel)]="habitGoalId" placeholder="Select a goal" interface="action-sheet" [disabled]="!goals.length">
          <ion-select-option *ngFor="let g of goals" [value]="g.id">{{ g.title }}</ion-select-option>
        </ion-select>
      </div>
    </ion-item>
    <p *ngIf="!goals.length" class="hint">Add a goal first, then add habits to it.</p>
    <app-color-picker
      label="Color"
      [config]="colorConfig"
      [selectedColor]="habitColor"
      (colorSelectedEvent)="habitColor = $event"
    ></app-color-picker>
    <app-weekday-picker
      label="Days of week"
      [selectedWeekdays]="habitSchedule"
      (weekdaysSelectedEvent)="onScheduleChange($event)"
    ></app-weekday-picker>
    <ion-item>
      <ion-label position="stacked">Progress increment</ion-label>
      <ion-input type="number" [(ngModel)]="habitProgressIncrement" min="0" placeholder="1"></ion-input>
    </ion-item>
  </div>

  <p *ngIf="error" class="error">{{ error }}</p>

  <ion-button expand="block" color="red-orange" (click)="save()" [disabled]="saving" class="save-button">Save</ion-button>
</ion-content>
