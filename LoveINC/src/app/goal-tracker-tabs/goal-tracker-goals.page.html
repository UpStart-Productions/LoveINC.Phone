<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/more"></ion-back-button>
    </ion-buttons>
    <ion-title>Goal Tracker</ion-title>
  </ion-toolbar>
  <div class="container-date-scroller">
    <app-date-scroller
      [completedDates]="completedDates"
      (dateSelectedEvent)="onDateSelected($event)"
    ></app-date-scroller>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="goals-content">
  <div *ngIf="loading" class="loading">Loading…</div>
  <div *ngIf="!loading && goalsWithHabits.length === 0" class="empty-state">
    <p class="app-body-secondary">No habits scheduled for this date.</p>
    <p class="app-caption">Add a goal and habits to get started.</p>
  </div>
  <div *ngIf="!loading && goalsWithHabits.length > 0" class="goals-list">
    <div *ngFor="let gwh of goalsWithHabits" class="goal-section">
      <app-habit-card
        [goal]="gwh.goal"
        [nested]="true"
        [allowEdit]="true"
        (goalEditEvent)="onGoalEdit($event)"
      ></app-habit-card>
      <app-habit-card
        *ngFor="let habit of gwh.habits"
        [habit]="habit"
        [nested]="true"
        [selectedDate]="selectedDate"
        [isCompleted]="completionMap[habit.id!] ?? false"
        [allowComplete]="true"
        [allowEdit]="true"
        (habitMarkedEvent)="onHabitMarked($event)"
        (habitEditEvent)="onHabitEdit($event)"
      ></app-habit-card>
    </div>
  </div>
</ion-content>
