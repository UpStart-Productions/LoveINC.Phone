<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tools"></ion-back-button>
    </ion-buttons>
    <ion-title>Weekly Review</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="loading" class="loading">Loading…</div>

  <div *ngIf="!loading && plan" class="review-content">
    <p class="app-body-secondary intro">Reflect on this week. Your notes help you learn over time.</p>

    <ion-list lines="none" class="review-list">
      <ion-item>
        <ion-label position="stacked">What changed from your plan?</ion-label>
        <ion-textarea
          [(ngModel)]="plan.reviewWhatChanged"
          (ionInput)="scheduleSave()"
          placeholder="e.g. Car repair cost more than expected"
          rows="2"
          autocapitalize="sentences"
        ></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">New money that came in</ion-label>
        <ion-textarea
          [(ngModel)]="plan.reviewNewMoney"
          (ionInput)="scheduleSave()"
          placeholder="e.g. Overtime pay, gift"
          rows="2"
          autocapitalize="sentences"
        ></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Bills higher than expected</ion-label>
        <ion-textarea
          [(ngModel)]="plan.reviewBillsHigher"
          (ionInput)="scheduleSave()"
          placeholder="e.g. Electric bill was $20 more"
          rows="2"
          autocapitalize="sentences"
        ></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Other notes (optional)</ion-label>
        <ion-textarea
          [(ngModel)]="plan.reviewNotes"
          (ionInput)="scheduleSave()"
          placeholder="Anything else you want to remember"
          rows="2"
          autocapitalize="sentences"
        ></ion-textarea>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
