<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/more"></ion-back-button>
    </ion-buttons>
    <ion-title>Export</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="loading" class="loading">Loading…</div>

  <div *ngIf="!loading && plan" class="export-content">
    <ion-card class="summary-card">
      <ion-card-header>
        <ion-card-title>Week Summary</ion-card-title>
        <ion-card-subtitle *ngIf="weekDateRange">Week of {{ weekDateRange }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-list lines="none">
          <ion-item *ngFor="let row of displayRows">
            <ion-label>{{ row.label }}</ion-label>
            <ion-note slot="end" [class.amount-positive]="getAmountClass(row) === 'positive'" [class.amount-negative]="getAmountClass(row) === 'negative'">{{ formatValue(row.value) }}</ion-note>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" (click)="exportPdf()" [disabled]="exporting" class="export-button">
      <ion-icon name="document-text-outline" slot="start"></ion-icon>
      {{ exporting ? 'Creating PDF…' : 'Export PDF' }}
    </ion-button>
  </div>
</ion-content>
