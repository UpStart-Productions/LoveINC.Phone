<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Learn</ion-title>
    <ion-buttons slot="end"><app-header-actions /></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="app-card-page" [fullscreen]="true">
  @if (listItems.length) {
    <app-content-card-list
      [items]="listItems"
      [compactCategoryLabel]="true"
      defaultNavigationFrom="tools"
    />
  }
</ion-content>
