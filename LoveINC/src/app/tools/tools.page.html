<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button fallback="/tabs/more"></app-back-button>
    </ion-buttons>
    <ion-title>Tools</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-content-card-list
    [items]="toolListItems"
    [compactCategoryLabel]="true"
    defaultNavigationFrom="tools"
  />
</ion-content>
