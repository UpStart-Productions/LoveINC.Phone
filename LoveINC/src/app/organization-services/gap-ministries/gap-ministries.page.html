<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="fromServices">
      <app-back-button></app-back-button>
    </ion-buttons>
    <ion-title>
      Gap Ministries
    </ion-title>
    <ion-buttons slot="end">
      <app-notifications-button></app-notifications-button>
      <ion-button *ngIf="showDonateButton" (click)="openDonateMenu()" class="donate-header-button">
        <ion-icon slot="icon-only" name="gift-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="!showFullGapCards" class="content-wrapper content-wrapper--simple">
    <p class="app-body content-wrapper--simple__intro ion-padding">
      Love INC connects you to real help through local churches, matching your needs with trusted community resources.
    </p>
    <ion-card class="more-list-card">
      <ion-list lines="none">
        <ion-item
          *ngFor="let service of compactListServices"
          button
          detail="false"
          (click)="onCardClick(service)">
          <ion-thumbnail slot="start" aria-hidden="true">
            <img *ngIf="service.photoUrl" [src]="service.photoUrl" [alt]="" />
            <ion-icon *ngIf="!service.photoUrl" name="people-outline"></ion-icon>
          </ion-thumbnail>
          <ion-label class="gap-more-list__label">{{ service.service }}</ion-label>
          <ion-icon
            class="list-row-chevron"
            name="chevron-forward-outline"
            slot="end"
            aria-hidden="true"
          ></ion-icon>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>

  <div *ngIf="showFullGapCards" class="content-wrapper">
    <div *ngFor="let schedule of scheduleOrder">
      <div *ngIf="groupedServices[schedule]?.length" class="schedule-section">
        <h2 class="schedule-header app-caption app-uppercase">{{ schedule }}</h2>
        <app-card
          *ngFor="let service of groupedServices[schedule]"
          class="app-card-compact"
          [title]="service.service"
          [subtitle]="service.daysTimes"
          [description]="getServiceDescription(service)"
          [actionIcons]="getActionIcons(service)"
          [imageUrl]="service.photoUrl"
          imagePosition="right"
          [thumbnailPlaceholderIcon]="service.photoUrl ? undefined : 'people-outline'"
          [style.--app-card-margin-bottom]="'0.75rem'"
          [clickable]="true"
          (cardClick)="onCardClick(service)"
          (contentAreaClick)="onGapCardContentAreaClick($event, service)"
          (shareClick)="onShareService(service)">
        </app-card>
      </div>
    </div>
  </div>
</ion-content>
