<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{ welcomeTitle }}
    </ion-title>
    <ion-buttons slot="end">
      <app-notifications-button></app-notifications-button>
      <ion-button *ngIf="showDonateButton" (click)="openDonateMenu()" class="donate-header-button">
        <ion-icon slot="icon-only" name="gift-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- User Type Cards and CTA rows - full width, no extra margin/padding -->
  <div class="home-top-items">
    <app-user-type-card
      *ngFor="let userType of selectedUserTypesForUserCards"
      [userType]="userType"
      [getHelpDescription]="clientSupportCardDescription"
      [getHelpAction]="clientSupportCardAction">
    </app-user-type-card>

    <!-- Volunteer CTAs from API (only when user selected volunteer and there are active CTAs) -->
    @if (showVolunteerCtas) {
      <app-home-cta-row
        *ngFor="let cta of volunteerCtas"
        [cta]="cta"
        ctaContext="volunteer">
      </app-home-cta-row>
    }

    <!-- Give CTAs from API (only when user selected give and there are active CTAs) -->
    @if (showGiveCtas) {
      <app-home-cta-row
        *ngFor="let cta of giveCtas"
        [cta]="cta"
        ctaContext="give">
      </app-home-cta-row>
    }
  </div>

  <!-- Verse of the Day widget -->
  <app-verse-of-the-day-widget></app-verse-of-the-day-widget>

  <!-- Home Cards - With Padding -->
  <div class="cards-container">
    <app-card
      *ngFor="let card of cards"
      class="app-card-compact"
      [class.app-card-impact]="card.type === 'impact'"
      [imageUrl]="card.photoUrl"
      [badge]="card.badge"
      [title]="card.title"
      [subtitle]="card.subtitle"
      [description]="card.shortDescription"
      [actionIcons]="getActionIcons(card)"
      [clickable]="true"
      (cardClick)="navigateToCard(card)"
      (shareClick)="onShareCard(card)">
    </app-card>
  </div>
</ion-content>
