<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{ welcomeTitle }}
    </ion-title>
    <ion-buttons slot="end">
      <app-notifications-button></app-notifications-button>
      <ion-button *ngIf="showDonateButton" (click)="openDonateMenu()" class="donate-header-button">
        <ion-icon slot="icon-only" name="gift-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="home-page">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="home-sections">
    @if (homeCtaRows.length) {
      <ion-card class="home-cta-card">
        @for (row of homeCtaRows; track row.id) {
          <app-home-cta-row [row]="row"></app-home-cta-row>
        }
      </ion-card>
    }

    <app-verse-of-the-day-widget></app-verse-of-the-day-widget>

    <app-simple-budget-home-widget></app-simple-budget-home-widget>

    <app-goal-tracker-home-widget></app-goal-tracker-home-widget>

    @for (theme of homeMicrolearningThemes; track theme.id) {
      <app-microlearning-theme-widget
        [themeId]="theme.id"
        [sectionTitleIconSvg]="theme.iconSvg"
        [sectionTitleInset]="microlearningSectionTitleInset"
        [clickable]="true"
        (slideClick)="onPeekPlanSlideClick($event)"
      />
    }

    @if (showShareAppCard) {
      <app-home-share-app-card (dismiss)="onShareAppCardDismiss()" />
    }

    <div class="cards-container">
      <app-card
        *ngFor="let card of cards"
        class="app-card-compact"
        [class.app-card-impact]="card.type === 'impact'"
        [imageUrl]="card.photoUrl"
        [badge]="card.badge"
        [title]="card.title"
        [subtitle]="card.subtitle"
        [description]="card.shortDescription"
        [actionIcons]="getActionIcons(card)"
        [clickable]="true"
        (cardClick)="navigateToCard(card)"
        (shareClick)="onShareCard(card)">
      </app-card>
    </div>
  </div>
</ion-content>
