<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{ welcomeTitle }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="notifications-button" (click)="openAlertsModal()">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
        <span class="notification-badge"></span>
      </ion-button>
      <ion-button *ngIf="showDonateButton" (click)="openDonateMenu()" class="donate-header-button">
        <ion-icon slot="icon-only" name="gift-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- User Type Cards - only get-help (volunteer/give shown via CTA rows below when API has CTAs) -->
  <app-user-type-card
    *ngFor="let userType of selectedUserTypesForUserCards"
    [userType]="userType">
  </app-user-type-card>

  <!-- Volunteer CTAs from API (only when user selected volunteer and there are active CTAs) -->
  @if (showVolunteerCtas) {
    <app-home-cta-row
      *ngFor="let cta of volunteerCtas"
      [cta]="cta"
      ctaContext="volunteer">
    </app-home-cta-row>
  }

  <!-- Give CTAs from API (only when user selected give and there are active CTAs) -->
  @if (showGiveCtas) {
    <app-home-cta-row
      *ngFor="let cta of giveCtas"
      [cta]="cta"
      ctaContext="give">
    </app-home-cta-row>
  }

  <!-- Home Cards - With Padding -->
  <div class="cards-container">
    <app-card
      *ngFor="let card of cards"
      class="home-card"
      [class.impact-card]="card.type === 'impact'"
      [imageUrl]="card.photoUrl"
      [badge]="card.badge"
      [title]="card.title"
      [subtitle]="card.subtitle"
      [description]="card.shortDescription"
      [clickable]="true"
      (cardClick)="navigateToCard(card)"
      (shareClick)="onShareCard(card)">
    </app-card>
  </div>
</ion-content>
