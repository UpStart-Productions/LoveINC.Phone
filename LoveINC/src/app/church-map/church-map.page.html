<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button></app-back-button>
    </ion-buttons>
    <ion-title>
      Partner Churches Map
    </ion-title>
    <ion-buttons slot="end">
      <app-notifications-button></app-notifications-button>
      <ion-button *ngIf="showDonateButton" (click)="openDonateMenu()" class="donate-header-button">
        <ion-icon slot="icon-only" name="gift-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (mapPins.length === 0) {
    <div class="empty-state ion-padding">
      <p class="app-body-secondary">
        No church partners could be placed on the map. Check that partners have addresses in the platform admin.
      </p>
    </div>
  } @else {
    <div id="map"></div>
  }
  @if (mapLoadError) {
    <div class="map-message">
      <p>Map could not load. Check your connection and try again.</p>
    </div>
  }
</ion-content>
