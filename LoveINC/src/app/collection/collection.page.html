<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button [fallback]="backFallback"></app-back-button>
    </ion-buttons>
    <ion-title>{{ pageTitle }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (!loading && listItems.length === 0) {
    <p class="app-body-secondary p-l-18 p-r-18 p-t-12">
      Nothing is available in this collection right now. Check back soon.
    </p>
  }
  @if (!loading && listItems.length > 0) {
    <app-content-card-list
      [items]="listItems"
      defaultNavigationFrom="collection"
      defaultAsideAvatarSize="large"
    />
  }
</ion-content>
