<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/more"></ion-back-button>
    </ion-buttons>
    <ion-title>Church Partnerships</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (partners.length === 0) {
    <div class="empty-state">
      <p class="app-body-secondary-sm">No church partners are currently listed.</p>
    </div>
  } @else {
    <div class="partners-list">
      @for (partner of partners; track partner.id) {
        <app-content-card
          [title]="partner.name"
          [detail]="getCardDetail(partner)"
          [imageUrl]="getPhotoUrl(partner) || undefined"
          [iconName]="getPhotoUrl(partner) ? undefined : 'business-outline'"
          [iconBackgroundColor]="'#349394'"
          [route]="'/tabs/partner/' + partner.id + '?from=church-partnerships'"
        />
      }
    </div>
  }
</ion-content>
