<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button></app-back-button>
    </ion-buttons>
    <ion-title>Church Partnerships</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else if (partners.length === 0) {
    <div class="empty-state">
      <p class="app-body-secondary-sm">No church partners are currently listed.</p>
    </div>
  } @else {
    <div class="partners-list">
      @for (partner of partners; track partner.id) {
        <app-content-card
          [title]="partner.name"
          [subtitle]="partner.tagline?.trim() || undefined"
          [underTitle]="formatAddress(partner) || undefined"
          [tapUnderTitleToOpenMap]="!!formatAddress(partner)"
          [mapPhone]="partner.phone"
          [mapWebsite]="partner.website"
          [detail]="partner.shortDescription?.trim() || undefined"
          [imageUrl]="getPhotoUrl(partner) || undefined"
          [iconName]="getPhotoUrl(partner) ? undefined : 'business-outline'"
          [iconBackgroundColor]="'#349394'"
          [route]="'/tabs/content-detail/partner/' + partner.id + '?from=church-partnerships'"
        />
      }
    </div>
  }
</ion-content>
