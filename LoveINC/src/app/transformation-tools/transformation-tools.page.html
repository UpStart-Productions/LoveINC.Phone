<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button fallback="/tabs/tools"></app-back-button>
    </ion-buttons>
    <ion-title>Transformation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (!loading && tools.length === 0) {
    <p class="app-body-secondary p-l-18 p-r-18 p-t-12">
      No tools are available right now. Check back soon.
    </p>
  }
  @if (!loading && tools.length > 0) {
    <ion-card class="transformation-tools-list-card">
      <ion-list lines="none">
        @for (tool of tools; track tool.id) {
          <ion-item button detail="false" (click)="navigateToDetail(tool)">
            <ion-label>
          <p class="app-list-row-title">{{ tool.title }}</p>
              @if (getScriptureSubtitle(tool)) {
                <p class="app-body-secondary">{{ getScriptureSubtitle(tool) }}</p>
              }
            </ion-label>
            <ion-icon
              class="list-row-chevron"
              name="chevron-forward-outline"
              slot="end"
              aria-hidden="true"
            ></ion-icon>
          </ion-item>
        }
      </ion-list>
    </ion-card>
  }
</ion-content>
