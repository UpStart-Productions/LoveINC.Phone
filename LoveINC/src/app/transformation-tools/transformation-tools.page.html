<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tools"></ion-back-button>
    </ion-buttons>
    <ion-title>Tools for Transformation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (!loading && tools.length === 0) {
    <p class="app-body-secondary p-l-18 p-r-18 p-t-12">
      No tools are available right now. Check back soon.
    </p>
  }
  <div class="cards-container">
    @for (tool of tools; track tool.id) {
      <app-card
        class="app-card-compact"
        [title]="tool.title"
        [subtitle]="getScriptureSubtitle(tool)"
        [description]="getExcerpt(tool)"
        [clickable]="true"
        [showShareIcon]="false"
        (cardClick)="navigateToDetail(tool)">
      </app-card>
    }
  </div>
</ion-content>
