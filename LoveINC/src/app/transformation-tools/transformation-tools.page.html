<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button fallback="/tabs/tools"></app-back-button>
    </ion-buttons>
    <ion-title>Tools for Transformation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (!loading && listItems.length === 0) {
    <p class="app-body-secondary p-l-18 p-r-18 p-t-12">
      No tools are available right now. Check back soon.
    </p>
  }
  @if (!loading && listItems.length > 0) {
    <app-content-card-list
      [items]="listItems"
      defaultNavigationFrom="transformation-tools"
      [defaultIconBackgroundColor]="'#349394'"
    />
  }
</ion-content>
